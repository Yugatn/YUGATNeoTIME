ь загрузки · новое окно ↗\u003c/a>\u003ca class=\"load-link\" id=\"inline-load\" href=\"./index.html?view=load\">Календарь загрузки · здесь\u003c/a>\u003c/div>\n\u003csection class=\"metrics\" aria-label=\"Итоги месяца\">\u003cdiv class=\"metric\">\u003cspan>Сотрудники\u003c/span>\u003cstrong id=\"staff-count\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Рабочие часы\u003c/span>\u003cstrong id=\"hours-count\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Смены\u003c/span>\u003cstrong id=\"shift-count\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Ночные\u003c/span>\u003cstrong id=\"night-count\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Короткий отдых / пересечения\u003c/span>\u003cstrong id=\"issue-count\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Дни ниже цели\u003c/span>\u003cstrong id=\"shortage\">0\u003c/strong>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003ch2 id=\"period-title\" class=\"period\">\u003c/h2>\u003cdiv class=\"row no-print\">\u003cbutton id=\"prev\" aria-label=\"Предыдущий месяц\">‹\u003c/button>\u003cinput id=\"month\" type=\"month\" min=\"1900-01\" max=\"2200-12\" aria-label=\"Месяц графика\">\u003cbutton id=\"next\" aria-label=\"Следующий месяц\">›\u003c/button>\u003cbutton id=\"today\">Текущий месяц\u003c/button>\u003cbutton id=\"undo\" disabled>Отменить действие\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"panel no-print\">\u003ch2>Сотрудники\u003c/h2>\u003cdiv class=\"row\">\u003cbutton id=\"add\" class=\"primary\">+ Сотрудник\u003c/button>\u003cselect id=\"employee\" aria-label=\"Выбранный сотрудник\">\u003c/select>\u003cbutton id=\"edit\">Изменить\u003c/button>\u003cbutton id=\"remove\">Удалить\u003c/button>\u003c/div>\n\u003cform class=\"form\" id=\"employee-form\" hidden>\u003ch3 id=\"form-title\">\u003c/h3>\u003cinput type=\"hidden\" id=\"edit-id\">\u003clabel>Имя или табельный номер\u003cinput id=\"name\" maxlength=\"120\" required placeholder=\"Рабочий 01\">\u003c/label>\u003clabel>Профессия / бригада\u003cinput id=\"role\" maxlength=\"120\" placeholder=\"Монтажник\">\u003c/label>\u003cbutton class=\"primary\" type=\"submit\">Сохранить\u003c/button>\u003cbutton type=\"button\" id=\"cancel\">Отмена\u003c/button>\u003c/form>\n\u003c/section>\n\u003csection class=\"panel no-print\">\u003ch2>Назначение смены\u003c/h2>\u003cp>Выберите тип, затем нажмите нужную клетку. Данные разных месяцев сохраняются.\u003c/p>\u003cdiv class=\"row toolbar\">\n\u003cbutton data-brush=\"4h\" class=\"type-C\">4 часа\u003c/button>\u003cbutton data-brush=\"6h\" class=\"type-C\">6 часов\u003c/button>\u003cbutton data-brush=\"8h\" class=\"type-C\">8 часов\u003c/button>\u003cbutton data-brush=\"12h\" class=\"type-C\">12 часов\u003c/button>\u003cbutton data-brush=\"D\" class=\"type-D\">Д · 08–20\u003c/button>\u003cbutton data-brush=\"N\" class=\"type-N\">Н · 20–08\u003c/button>\u003cbutton data-brush=\"S\" class=\"type-S\">6ч · 08–14\u003c/button>\u003cbutton data-brush=\"C\" class=\"type-C\">Своя смена\u003c/button>\u003cbutton data-brush=\"O\" class=\"type-O\">Выходной\u003c/button>\u003cbutton data-brush=\"V\" class=\"type-V\">Отпуск\u003c/button>\u003cbutton data-brush=\"A\" class=\"type-A\">Отсутствие\u003c/button>\u003cbutton data-brush=\"clear\">Очистить\u003c/button>\u003c/div>\n\u003cdiv id=\"preset\" class=\"form\" hidden>\u003clabel>Начало смены\u003cinput id=\"preset-start\" type=\"time\" value=\"08:00\">\u003c/label>\u003clabel>Перерыв (мин)\u003cinput id=\"preset-break\" type=\"number\" min=\"0\" max=\"719\" step=\"1\" value=\"0\">\u003c/label>\u003cspan id=\"preset-info\" class=\"group-summary\">\u003c/span>\u003c/div>\u003cdiv id=\"custom\" class=\"form\" hidden>\u003clabel>Начало\u003cinput id=\"start\" type=\"time\" value=\"09:00\">\u003c/label>\u003clabel>Окончание\u003cinput id=\"end\" type=\"time\" value=\"18:00\">\u003c/label>\u003clabel>Перерыв (минуты)\u003cinput id=\"break\" type=\"number\" min=\"0\" max=\"1439\" step=\"1\" value=\"60\">\u003c/label>\u003c/div>\u003csmall>Дневная и ночная смены: 12 часов минус 1 час перерыва. Короткая: 6 часов без перерыва. В вариантах 4/6/8/12 указана полная длительность присутствия; перерыв вычитается из рабочих часов. Циклы используют выбранную длительность и время начала; для «день/ночь» ночное начало сдвигается на 12 часов.\u003c/small>\n\u003cdiv class=\"row\" style=\"margin-top:12px;align-items:end\">\u003clabel>Цикл на месяц\u003cselect id=\"cycle\">\u003coption value=\"2/2\">2/2 · дневные\u003c/option>\u003coption value=\"3/3\">3/3 · дневные\u003c/option>\u003coption value=\"5/2\">5/2 · Пн–Пт\u003c/option>\u003coption value=\"день/ночь/2\">День / ночь / 2 выходных\u003c/option>\u003c/select>\u003c/label>\u003clabel>Сдвиг цикла (дни)\u003cinput id=\"offset\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" step=\"1\" style=\"width:90px\">\u003c/label>\u003cbutton id=\"cycle-apply\" class=\"primary\">Заполнить сотруднику\u003c/button>\u003cbutton id=\"clear-month\">Очистить месяц\u003c/button>\u003c/div>\u003csmall>Цикл начинается с 1-го числа выбранного месяца; сдвиг позволяет распределить бригады. Для 5/2 сдвиг не применяется. Праздники автоматически не исключаются.\u003c/small>\n\u003c/section>\n\u003csection class=\"panel no-print\">\u003ch2>Групповое планирование бригады\u003c/h2>\u003cp>Отметьте работников слева в табеле или выберите их по бригаде. Одно действие применяется ко всем выбранным.\u003c/p>\u003cdiv class=\"row\">\u003cbutton id=\"group-all\">Выбрать всех\u003c/button>\u003cbutton id=\"group-none\">Снять выбор\u003c/button>\u003cselect id=\"group-role\" aria-label=\"Профессия или бригада\">\u003c/select>\u003cbutton id=\"group-select-role\">Выбрать по группе\u003c/button>\u003cspan id=\"group-count\" class=\"group-summary\">\u003c/span>\u003c/div>\n\u003cdiv class=\"form\" style=\"margin-top:10px\">\u003clabel>С даты\u003cinput id=\"range-from\" type=\"date\">\u003c/label>\u003clabel>По дату\u003cinput id=\"range-to\" type=\"date\">\u003c/label>\u003cbutton id=\"group-apply\" class=\"primary\">Назначить выбранную смену\u003c/button>\u003cbutton id=\"group-clear\">Очистить диапазон\u003c/button>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003clabel style=\"flex-direction:row;align-items:center\">\u003cinput type=\"checkbox\" id=\"stagger\" style=\"min-height:0;width:18px;height:18px\"> Сдвиг цикла на 1 день для каждого следующего работника\u003c/label>\u003cbutton id=\"group-cycle\">Заполнить цикл на весь месяц\u003c/button>\u003c/div>\u003csmall>Для цикла 5/2 сдвиг не применяется. Используются настройки цикла из предыдущего блока.\u003c/small>\n\u003cdetails>\u003csummary>Добавить целую бригаду списком\u003c/summary>\u003cdiv class=\"form\">\u003clabel>Профессия / бригада\u003cinput id=\"bulk-role\" maxlength=\"120\" placeholder=\"Бригада № 1\">\u003c/label>\u003clabel>Имена или табельные номера, по одному в строке\u003ctextarea id=\"bulk-names\" placeholder=\"Рабочий 01&#10;Рабочий 02&#10;Рабочий 03\">\u003c/textarea>\u003c/label>\u003cbutton id=\"bulk-add\" class=\"primary\">Добавить и выбрать\u003c/button>\u003c/div>\u003c/details>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>Табель смен\u003c/h2>\u003cdiv id=\"empty\" class=\"empty\">\u003cp>Добавьте сотрудника, чтобы начать планировать график.\u003c/p>\u003c/div>\u003cdiv class=\"table-wrap\" tabindex=\"0\" aria-label=\"Таблица смен с горизонтальной прокруткой\">\u003ctable id=\"schedule\">\u003c/table>\u003c/div>\u003cp>\u003csmall>Часы — без перерыва, вся ночная смена относится к дате начала. «± нормы» — разница с заданным ориентиром, не юридический расчёт сверхурочных. Итог по дням учитывает начала смен, а не круглосуточное покрытие.\u003c/small>\u003c/p>\u003c/section>\n\u003csection id=\"warn-panel\" class=\"panel\" hidden>\u003ch2 class=\"notice\">Проверка интервалов отдыха\u003c/h2>\u003cul id=\"warnings\">\u003c/ul>\u003csmall>Предупреждения — планировочные ориентиры, а не заключение о соблюдении законодательства.\u003c/small>\u003c/section>\n\u003csection class=\"panel no-print\">\u003ch2>Настройки нагрузки\u003c/h2>\u003cdiv class=\"form\">\u003clabel>Норма часов на сотрудника в месяц\u003cinput id=\"norm\" type=\"number\" min=\"0\" max=\"744\" step=\"0.5\" style=\"width:135px\">\u003c/label>\u003clabel>Минимальный отдых (ч)\u003cinput id=\"rest\" type=\"number\" min=\"0\" max=\"48\" step=\"0.5\" style=\"width:135px\">\u003c/label>\u003clabel>Цель по числу начал смен в день\u003cinput id=\"target\" type=\"number\" min=\"0\" max=\"500\" step=\"1\" style=\"width:135px\">\u003c/label>\u003c/div>\u003csmall>Ориентиры задаёт руководитель с учётом договора, режима труда и применимого законодательства. Пересечения смен выделяются независимо от выбранного порога отдыха.\u003c/small>\u003c/section>\n\u003csection class=\"panel no-print\">\u003ch2>Экспорт и резервная копия\u003c/h2>\u003cdiv class=\"row\">\u003cbutton id=\"csv\">Табель CSV / Excel\u003c/button>\u003cbutton id=\"print\">Печать / PDF\u003c/button>\u003cbutton id=\"backup\">Скачать JSON\u003c/button>\u003clabel>Восстановить из JSON\u003cinput id=\"restore\" type=\"file\" accept=\".json,application/json\" class=\"file\">\u003c/label>\u003c/div>\u003cp>Данные хранятся в браузере на этом устройстве, не синхронизируются и не передаются на сервер. Для переноса создайте резервную копию. Используйте табельные номера вместо лишних персональных сведений.\u003c/p>\u003c/section>\n\u003cp id=\"status\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003cfooter class=\"muted\">© 2026 Югатн · YUGATNeoTIME · Планирование, не расчёт заработной платы.\u003c/footer>\u003c/main>",LOAD_BODY="\u003cmain>\u003ca id=\"back-planner\" href=\"./index.html\">К планировщику смен\u003c/a> · \u003ca href=\"../index.html\">Календарь YUGATNeoTIME\u003c/a>\u003ch1>Календарь загрузки бригады\u003c/h1>\u003cp>Наложение графиков на общую ось времени. Число людей, присутствующих одновременно, а не число начатых за день смен.\u003c/p>\n\u003csection class=\"panel\">\u003cdiv class=\"row\" style=\"align-items:end\">\u003cbutton id=\"prev\">‹\u003c/button>\u003clabel>Месяц\u003cinput id=\"month\" type=\"month\" min=\"1900-01\" max=\"2200-12\">\u003c/label>\u003cbutton id=\"next\">›\u003c/button>\u003clabel>Допустимо одновременно, чел.\u003cinput id=\"limit\" type=\"number\" min=\"0\" max=\"500\" step=\"1\" value=\"10\">\u003c/label>\u003clabel>Бригада / профессия\u003cselect id=\"role\">\u003coption value=\"\">Все\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"refresh\">Обновить из табеля\u003c/button>\u003c/div>\u003cp class=\"small\">Красный означает превышение выбранного лимита. Данные считываются из локального табеля; изменения в другой вкладке обновляются автоматически.\u003c/p>\u003cp id=\"status\" role=\"status\">\u003c/p>\u003c/section>\n\u003cdiv class=\"metrics\">\u003cdiv class=\"metric\">\u003cspan>Сотрудники\u003c/span>\u003cstrong id=\"staff\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Пик присутствия\u003c/span>\u003cstrong id=\"peak\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Дней выше лимита\u003c/span>\u003cstrong id=\"over-days\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Время превышения, ч\u003c/span>\u003cstrong id=\"over-hours\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Человеко-часы присутствия\u003c/span>\u003cstrong id=\"person-hours\">0\u003c/strong>\u003c/div>\u003c/div>\n\u003csection class=\"panel\">\u003ch2>Месяц · календарь пиков\u003c/h2>\u003cp class=\"small\">Каждая дата показывает максимальное одновременное присутствие за сутки. Нажмите дату для просмотра по часам.\u003c/p>\u003cdiv id=\"calendar\" class=\"calendar\">\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>Месяц · общая ось времени\u003c/h2>\u003cp class=\"small\">Горизонтальная прокрутка. Верхняя строка показывает суммарную загрузку по часам (максимум за час), ниже — интервалы каждого сотрудника. Щёлкните дату на шкале, чтобы раскрыть день.\u003c/p>\u003cdiv class=\"row\">\u003clabel>Масштаб\u003cselect id=\"zoom\">\u003coption value=\"72\">Обзор\u003c/option>\u003coption value=\"144\" selected>Детально\u003c/option>\u003coption value=\"288\">Увеличенный\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"jump-day\">Перейти к выбранной дате\u003c/button>\u003c/div>\u003cdiv class=\"track-wrap\" id=\"month-wrap\" tabindex=\"0\">\u003cdiv class=\"timeline\" id=\"month-line\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"day-panel\">\u003cdiv class=\"row\" style=\"justify-content:space-between\">\u003ch2 id=\"day-title\">День · 24 часа\u003c/h2>\u003clabel>Дата\u003cinput type=\"date\" id=\"day\">\u003c/label>\u003c/div>\u003cdiv class=\"metrics\">\u003cdiv class=\"metric\">\u003cspan>Пик за день\u003c/span>\u003cstrong id=\"day-peak\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Часов выше лимита\u003c/span>\u003cstrong id=\"day-over\">0\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Человеко-часы\u003c/span>\u003cstrong id=\"day-person\">0\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"small\">Максимальное присутствие в каждом часовом интервале\u003c/p>\u003cdiv class=\"scroll\">\u003cdiv class=\"hour-strip\" id=\"hours\">\u003c/div>\u003c/div>\u003cdiv class=\"track-wrap\" tabindex=\"0\" style=\"margin-top:12px\">\u003cdiv class=\"timeline\" id=\"day-line\">\u003c/div>\u003c/div>\u003cp class=\"small\">Нажмите на полоску смены, чтобы перейти к этому сотруднику и дате в планировщике.\u003c/p>\u003ca id=\"edit-day\" href=\"./index.html\">Изменить график выбранного дня\u003c/a>\u003ch3>Точные интервалы превышения\u003c/h3>\u003cul class=\"summary-list\" id=\"over-intervals\">\u003c/ul>\u003cp id=\"no-over\" class=\"small\">Нет превышений.\u003c/p>\u003c/section>\n\u003cp class=\"legend\">Зелёный — в пределах лимита; красный — превышение; синий — смена через полночь. Перерывы не исключены из присутствия: в табеле указана их длительность, но не время начала. Часы присутствия отличаются от оплачиваемых часов. Шкала использует плановое местное время, 24 часа в сутках, без поправки на переход часов. Это инструмент планирования, не проверка законодательства.\u003c/p>\u003c/main>",PLAN_UI="(()=>{\n'use strict';\nconst C=ShiftCore,$=id=>document.getElementById(id),key='yugatneotime.shift-planner.v1';\nconst now=new Date();let year=now.getFullYear(),month=now.getMonth()+1,selected='',brush='D',data={version:1,employees:[],norm:160,rest:11,target:1},previous=null;\nconst labels={D:'Д',N:'Н',S:'6ч',C:'С',O:'В',V:'ОТ',A:'НЯ',clear:'×'};\nconst group=new Set();let rangeMonth='';const presetHours={'4h':4,'6h':6,'8h':8,'12h':12};\nconst isPreset=t=>Object.prototype.hasOwnProperty.call(presetHours,t);\nfunction groupMembers(){return data.employees.filter(e=>group.has(e.id))}\nfunction cellLabel(s){if(!s)return '·';if(s.type==='C'){const h=C.gross(s)/60;return [4,6,8,12].includes(h)?h+'ч':'С'}return labels[s.type]}\nfunction groupState(){const n=groupMembers().length;$('group-count').textContent=n+' из '+data.employees.length;$('group-apply').disabled=!n;$('group-cycle').disabled=!n;$('group-clear').disabled=!n;}\nfunction presetShift(t,night=false){return C.preset(presetHours[t],night?C.clock(C.minute($('preset-start').value)+720):$('preset-start').value,Number($('preset-break').value))}\nfunction updatePreset(){try{if(isPreset(brush)){const s=presetShift(brush);$('preset-info').textContent=s.start+'–'+s.end+(C.minute(s.end)\u003cC.minute(s.start)?' (+1 день)':'')+' · '+fmt(C.duration(s)/60)+' оплачиваемых ч (без перерыва)';}}catch(e){$('preset-info').textContent=e.message}}\nfunction cycleShift(t){if(t==='O')return C.shift('O');if(isPreset(brush))return presetShift(brush,t==='N');if(brush==='C'){const x=custom();const n=t==='N'?720:0;return C.shift('C',{start:C.clock(C.minute(x.start)+n),end:C.clock(C.mi
