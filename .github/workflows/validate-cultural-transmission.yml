name: Validate cultural transmission and scenario template

on:
  push:
    paths:
      - 'schemas/cultural-transmission.schema.json'
      - 'data/cultural-transmission-example.json'
      - 'data/translation-network-aristotle.json'
      - 'data/scenario-forecast-template.json'
      - 'scripts/validate_cultural_transmission.py'
      - 'scripts/validate_scenario_template.py'
      - 'docs/SCENARIO_FORECASTING_PROTOCOL.md'
      - 'schemas/historical-timeline.schema.json'
      - 'data/historical-timeline-example.json'
      - 'data/socrates-plato-starter.json'
      - 'data/aristotle-transmission-path.json'
      - 'schemas/intellectual-transmission.schema.json'
      - 'data/intellectual-transmission-graph-example.json'
      - 'scripts/validate_intellectual_transmission.py'
      - 'scripts/validate_historical_timeline.py'
      - '.github/workflows/validate-cultural-transmission.yml'
  pull_request:
    paths:
      - 'schemas/cultural-transmission.schema.json'
      - 'data/cultural-transmission-example.json'
      - 'data/translation-network-aristotle.json'
      - 'data/scenario-forecast-template.json'
      - 'scripts/validate_cultural_transmission.py'
      - 'scripts/validate_scenario_template.py'
      - 'docs/SCENARIO_FORECASTING_PROTOCOL.md'
      - 'schemas/historical-timeline.schema.json'
      - 'data/historical-timeline-example.json'
      - 'data/socrates-plato-starter.json'
      - 'data/aristotle-transmission-path.json'
      - 'schemas/intellectual-transmission.schema.json'
      - 'data/intellectual-transmission-graph-example.json'
      - 'scripts/validate_intellectual_transmission.py'
      - 'scripts/validate_historical_timeline.py'
      - '.github/workflows/validate-cultural-transmission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate cultural transmission graph
        run: python scripts/validate_cultural_transmission.py
      - name: Validate scenario forecast template
        run: python scripts/validate_scenario_template.py
      - name: Validate historical timeline dataset
        run: python scripts/validate_historical_timeline.py
      - name: Validate intellectual transmission graph
        run: python scripts/validate_intellectual_transmission.py
