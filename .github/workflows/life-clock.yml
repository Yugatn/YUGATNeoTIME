name: Life clock regression
on:
  push:
    paths:
      - 'life-clock.html'
      - 'tests/pwa.test.cjs'
      - 'tests/life-crypto.test.cjs'
      - 'src/pwa.js'
      - 'src/life-crypto-ui.js'
      - 'src/life-crypto.js'
      - 'icons/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'index.html'
      - 'src/life-clock.js'
      - 'src/life-clock-ui.js'
      - 'tests/life-insights.test.cjs'
      - 'src/life-insights-ui.js'
      - 'tests/life-milestones.test.cjs'
      - 'src/life-milestones-ui.js'
      - 'tests/life-transfer.test.cjs'
      - 'src/life-transfer-ui.js'
      - 'src/life-transfer.js'
      - 'tests/life-milestones-home.test.cjs'
      - 'src/life-milestones-home.js'
      - 'src/life-milestones.js'
      - 'src/life-insights.js'
      - 'tests/life-clock.test.cjs'
      - 'tests/life-clock-ui.test.cjs'
      - '.github/workflows/life-clock.yml'
  pull_request:
    paths:
      - 'life-clock.html'
      - 'tests/pwa.test.cjs'
      - 'tests/life-crypto.test.cjs'
      - 'src/pwa.js'
      - 'src/life-crypto-ui.js'
      - 'src/life-crypto.js'
      - 'icons/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'index.html'
      - 'src/life-clock.js'
      - 'src/life-clock-ui.js'
      - 'tests/life-insights.test.cjs'
      - 'src/life-insights-ui.js'
      - 'tests/life-milestones.test.cjs'
      - 'src/life-milestones-ui.js'
      - 'tests/life-transfer.test.cjs'
      - 'src/life-transfer-ui.js'
      - 'src/life-transfer.js'
      - 'tests/life-milestones-home.test.cjs'
      - 'src/life-milestones-home.js'
      - 'src/life-milestones.js'
      - 'src/life-insights.js'
      - 'tests/life-clock.test.cjs'
      - 'tests/life-clock-ui.test.cjs'
      - '.github/workflows/life-clock.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify life-clock arithmetic
        run: node tests/life-clock.test.cjs
      - name: Verify life-clock UI with mocked World Bank API
        run: node tests/life-clock-ui.test.cjs
      - name: Verify NCHS age-conditional data and personal horizon UI
        run: node tests/life-insights.test.cjs
      - name: Verify project milestones, calendar links and privacy
        run: node tests/life-milestones.test.cjs
      - name: Verify saved milestones in Atlas calendar
        run: node tests/life-milestones-home.test.cjs
      - name: Verify portable JSON and iCalendar transfers
        run: node tests/life-transfer.test.cjs
      - name: Verify AES-256-GCM encrypted project backups
        run: node tests/life-crypto.test.cjs
      - name: Verify PWA manifest, icons and offline shell
        run: node tests/pwa.test.cjs
      - name: Verify JavaScript syntax
        run: |
          node --check src/life-clock.js
          node --check src/life-clock-ui.js
          node --check src/life-insights.js
          node --check src/life-insights-ui.js
          node --check src/life-milestones.js
          node --check src/life-milestones-ui.js
          node --check src/life-milestones-home.js
          node --check src/life-transfer.js
          node --check src/life-transfer-ui.js
          node --check src/life-crypto.js
          node --check src/life-crypto-ui.js
          node --check src/pwa.js
          node --check sw.js
