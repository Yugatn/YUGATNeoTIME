name: Life clock regression
on:
  push:
    paths:
      - 'life-clock.html'
      - 'src/life-clock.js'
      - 'src/life-clock-ui.js'
      - 'tests/life-clock.test.cjs'
      - '.github/workflows/life-clock.yml'
  pull_request:
    paths:
      - 'life-clock.html'
      - 'src/life-clock.js'
      - 'src/life-clock-ui.js'
      - 'tests/life-clock.test.cjs'
      - '.github/workflows/life-clock.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify life-clock arithmetic
        run: node tests/life-clock.test.cjs
      - name: Verify JavaScript syntax
        run: |
          node --check src/life-clock.js
          node --check src/life-clock-ui.js
