name: Publish YUGATNeoTIME web apps

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'time-mini.html'
      - 'maya-mini.html'
      - 'maya.webmanifest'
      - 'maya/**'
      - 'shift-planner/**'
      - 'weather-sky.html'
      - 'weather-sky/**'
      - 'tests/weather-sky.test.cjs'
      - 'tests/shift-planner.test.cjs'
      - 'tests/maya-mini.test.cjs'
      - 'tests/maya-standalone.test.cjs'
      - 'life-clock.html'
      - 'cultural-graph.html'
      - 'mini.webmanifest'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'icons/**'
      - 'data/**'
      - 'docs/**'
      - 'LICENSE'
      - 'README.md'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Maya calendar checks
        run: |
          node tests/calendar-engine.test.cjs
          node tests/maya-mini.test.cjs
          node tests/maya-standalone.test.cjs
      - name: Run shift planner checks
        run: node tests/shift-planner.test.cjs
      - name: Run weather and sky checks
        run: node tests/weather-sky.test.cjs
      - name: Prepare public static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html time-mini.html maya-mini.html maya.webmanifest life-clock.html cultural-graph.html site/
          mkdir -p site/maya
          cp maya/index.html site/maya/index.html
          cp -R shift-planner site/
          cp weather-sky.html site/
          cp -R weather-sky site/
          cp manifest.webmanifest mini.webmanifest sw.js LICENSE README.md site/
          cp -R icons src data docs site/
          touch site/.nojekyll
          test -s site/maya-mini.html
          test -s site/maya.webmanifest
          test -s site/maya/index.html
          test -s site/time-mini.html
          test -s site/weather-sky.html
          test -s site/weather-sky/index.html
          grep -q 'id="tempChart"' site/weather-sky.html
          grep -q 'id="pressureChart"' site/weather-sky.html
          grep -q 'id="fxPanel"' site/weather-sky.html
          grep -q 'id="fxEditor"' site/weather-sky.html
          grep -q 'id="centeredMetrics"' site/weather-sky.html
          test -s site/shift-planner/index.html
          test -s site/shift-planner/load.html
          test -s site/shift-planner/shift-core.js
          test -s site/src/time-mini.js
          test -s site/src/life-clock.js
          test -s site/src/calendar-engine.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the unique Pages artifact to become visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" 2>/dev/null | jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length') || count=0
            if [ "$count" -eq 1 ]; then
              echo "Unique Pages artifact is ready: $ARTIFACT_NAME"
              exit 0
            fi
            sleep 4
          done
          echo "::error::Unique Pages artifact not visible in Actions API"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check live Maya calendar URL
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}maya/"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error --max-time 12 -o /tmp/maya-live.html "$url" && grep -q 'id="tzolkin"' /tmp/maya-live.html; then
              echo "Live mini app confirmed: $url"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The published Maya mini app did not respond correctly at $url"
          exit 1
      - name: Verify public Maya calendar response
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${SITE_URL%/}"
          TARGET="${BASE}/maya/index.html"
          echo "Checking public page: ${TARGET}"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --location --fail --silent --show-error --connect-timeout 10 --max-time 20 "${TARGET}" -o /tmp/maya-public.html; then
              if grep -q 'embedded-maya-engine' /tmp/maya-public.html; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::Public Maya calendar URL did not serve the expected HTML."
            exit 1
          fi
          echo "Public Maya entry point served expected HTML."

      - name: Verify public shift planner URLs
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${SITE_URL%/}"
          for entry in 'shift-planner/' 'shift-planner/index.html?view=load' 'shift-planner/load.html'; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl --fail --location --silent --show-error --max-time 20 "${BASE}/${entry}" -o /tmp/shifts-live.html && grep -q 'const ShiftCore=' /tmp/shifts-live.html && grep -q 'const PLAN_STYLE=' /tmp/shifts-live.html; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Shift planner page unavailable or stale: ${BASE}/${entry}"
              exit 1
            fi
            echo "Live shift planner confirmed: ${BASE}/${entry}"
          done

      - name: Verify public weather mini app
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${SITE_URL%/}"
          for entry in 'weather-sky.html' 'weather-sky/index.html'; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl --fail --location --silent --show-error --max-time 20 "${BASE}/${entry}?deploy=${GITHUB_SHA}" -o /tmp/weather-live.html; then
                if [ "$entry" = 'weather-sky.html' ]; then
                  if grep -q 'id="tempChart"' /tmp/weather-live.html && grep -q 'id="pressureChart"' /tmp/weather-live.html && grep -q 'id="fxEditor"' /tmp/weather-live.html && grep -q 'id="centeredMetrics"' /tmp/weather-live.html; then ok=1; break; fi
                else
                  if grep -q '../weather-sky.html' /tmp/weather-live.html; then ok=1; break; fi
                fi
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Weather page unavailable or stale: ${BASE}/${entry}"
              exit 1
            fi
            echo "Live weather entry confirmed: ${BASE}/${entry}"
          done
