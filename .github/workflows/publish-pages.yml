name: Publish YUGATNeoTIME web apps

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'time-mini.html'
      - 'life-clock.html'
      - 'cultural-graph.html'
      - 'mini.webmanifest'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'icons/**'
      - 'data/**'
      - 'docs/**'
      - 'LICENSE'
      - 'README.md'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html time-mini.html life-clock.html cultural-graph.html site/
          cp manifest.webmanifest mini.webmanifest sw.js LICENSE README.md site/
          cp -R icons src data docs site/
          touch site/.nojekyll
          test -s site/time-mini.html
          test -s site/src/time-mini.js
          test -s site/src/life-clock.js
          test -s site/src/calendar-engine.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
