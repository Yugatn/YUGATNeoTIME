name: Validate philosophical continuity data

on:
  push:
    paths:
      - 'data/philosophical-continuity.json'
      - 'data/philosophical-sources.json'
      - 'scripts/validate_philosophical_continuity.py'
      - '.github/workflows/validate-philosophy.yml'
  pull_request:
    paths:
      - 'data/philosophical-continuity.json'
      - 'data/philosophical-sources.json'
      - 'scripts/validate_philosophical_continuity.py'
      - '.github/workflows/validate-philosophy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate philosophical timeline
        run: python scripts/validate_philosophical_continuity.py
